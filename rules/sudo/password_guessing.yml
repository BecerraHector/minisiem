title: sudo password failure
name: sudo_failed_password
id: 9e3f4a5b-6c7d-4e8f-8a9b-1c2d3e4f5a6b
description: Building block for the correlation below; does not alert on its own.
logsource:
  product: linux
  service: sudo
detection:
  selection:
    event_kind: sudo_failed_password
  condition: selection
---
title: sudo password guessing
id: 0f4a5b6c-7d8e-4f9a-9b0c-2d3e4f5a6b7c
status: experimental
description: |
  One user gave sudo wrong passwords again and again: someone on that
  account guessing its password to escalate. Each event is sudo's summary
  of up to three attempts.
author: minisiem
date: 2026-10-29
tags:
  - attack.privilege_escalation
  - attack.t1548.003
  - attack.credential_access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - sudo_failed_password
  group-by:
    - user
  timespan: 10m
  condition:
    gte: 3
falsepositives:
  - A user who forgot their password
level: medium
