title: sudo by a user not in sudoers
id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
status: experimental
description: |
  A user without sudo rights tried to run a command as another user: an
  attacker on a compromised account probing for privilege escalation.
author: minisiem
date: 2026-10-29
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: sudo
detection:
  selection:
    event_kind: sudo_denied
  keywords:
    - 'user NOT in sudoers'
  condition: selection and keywords
falsepositives:
  - A new user who was not added to the sudo group yet
level: high
