[package]
name = "minisiem"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ipnet = "2.12.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
